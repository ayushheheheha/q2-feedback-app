<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Feedback</title>
<style>
  body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; }
  .card { max-width: 480px; margin: 30px auto; background: #fff; padding: 24px;
          border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h1 { text-align: center; color: #1a3c6e; margin-top: 0; }
  label { display: block; margin-top: 12px; font-weight: bold; }
  input, select, textarea { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
  button { margin-top: 18px; width: 100%; padding: 10px; background: #1a3c6e; color: #fff;
           border: 0; border-radius: 4px; font-size: 16px; cursor: pointer; }
  #thanks { display: none; margin-top: 16px; padding: 12px; background: #e6f4ea;
            color: #1e6b34; border-radius: 4px; text-align: center; font-weight: bold; }
</style>
</head>
<body>
<div class="card">
  <h1>Student Feedback Form <small style="font-size:12px;color:#888">v2</small></h1>
  <form onsubmit="document.getElementById('thanks').style.display='block'; return false;">
    <label>Course Name</label>
    <input type="text" placeholder="e.g. Agile Development Process & DevOps">
    <label>Faculty Name</label>
    <input type="text">
    <label>Student Name</label>
    <input type="text">
    <label>Register Number</label>
    <input type="text" placeholder="e.g. 24MIS0295">
    <label>Department</label>
    <input type="text" value="School of Computer Science and Engineering">
    <label>Rating</label>
    <select>
      <option>5 - Excellent</option>
      <option>4 - Very Good</option>
      <option>3 - Good</option>
      <option>2 - Fair</option>
      <option>1 - Poor</option>
    </select>
    <label>Feedback / Comments</label>
    <textarea rows="4"></textarea>
    <button type="submit">Submit</button>
    <div id="thanks">Thank you! Your feedback has been submitted.</div>
  </form>
</div>
</body>
</html>
