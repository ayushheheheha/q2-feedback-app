apiVersion: apps/v1
kind: Deployment
metadata:
  name: feedback-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: feedback-app
  template:
    metadata:
      labels:
        app: feedback-app
    spec:
      containers:
      - name: feedback-app
        image: ayushsksksk/feedback-app:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: feedback-app-service
spec:
  type: NodePort
  selector:
    app: feedback-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30012
